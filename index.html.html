<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Meesho Profit Calculator • Exact Formula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f5f3ff 0%, #ede9fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .calculator-container {
      max-width: 1150px;
      width: 100%;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.25);
      border-radius: 2.5rem;
      padding: 2rem 2.2rem;
      border: 1px solid rgba(255,255,255,0.5);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.9rem;
      color: #1e1b4b;
      margin-bottom: 0.3rem;
      letter-spacing: -0.5px;
    }
    h1 i {
      color: #f97316;
      background: #fff7ed;
      padding: 0.5rem;
      border-radius: 50%;
      font-size: 1.8rem;
    }
    .subtitle {
      color: #4b5563;
      font-weight: 500;
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
      border-left: 4px solid #8b5cf6;
      padding-left: 1rem;
    }

    .mode-tabs {
      display: flex;
      gap: 0.8rem;
      background: #f1f0ff;
      padding: 0.5rem;
      border-radius: 3rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .mode-btn {
      flex: 1 1 auto;
      padding: 0.9rem 1.8rem;
      border: none;
      background: transparent;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      color: #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .mode-btn i {
      font-size: 1.1rem;
    }
    .mode-btn.active {
      background: white;
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.35);
      color: #6d28d9;
      font-weight: 700;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 1.8rem;
    }
    @media (max-width: 750px) {
      .card-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .calculator-container {
        padding: 1.5rem;
      }
    }

    .input-card {
      background: #faf9ff;
      border-radius: 1.8rem;
      padding: 1.6rem 1.5rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.02);
      border: 1px solid #e9e7f5;
      max-height: 620px;
      overflow-y: auto;
    }
    .input-card h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2e1065;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-bottom: 2px dashed #d8d4f0;
      padding-bottom: 0.7rem;
    }

    .input-group {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #e0dbf5;
      border-radius: 1rem;
      padding: 0.2rem 0.2rem 0.2rem 1rem;
      transition: 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
    }
    .input-wrapper span {
      color: #6b7280;
      font-weight: 500;
      margin-right: 0.3rem;
    }
    .input-wrapper input {
      width: 100%;
      border: none;
      padding: 0.75rem 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      background: transparent;
      outline: none;
      color: #111827;
    }
    .percent-symbol {
      font-weight: 600;
      color: #6d28d9;
      margin-right: 0.8rem;
    }

    .results-panel {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border-radius: 1.8rem;
      padding: 1.6rem 1.5rem;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.5);
    }
    .results-panel h2 {
      font-weight: 600;
      font-size: 1.3rem;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #e0e7ff;
    }
    .result-item {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      margin-bottom: 0.9rem;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .roi-box {
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      margin-bottom: 0.9rem;
    }
    .result-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #c7d2fe;
      margin-bottom: 0.3rem;
    }
    .result-value {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }
    .result-value small {
      font-size: 1rem;
      font-weight: 500;
      color: #ddd6fe;
    }
    .delivery-badge {
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }
    .formula-breakdown {
      font-size: 0.7rem;
      color: #fcd34d;
      margin-top: 0.35rem;
      line-height: 1.4;
    }
    .reset-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 0.75rem 1.2rem;
      border-radius: 2.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    .reset-btn:hover {
      background: rgba(255,255,255,0.25);
    }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
    }
    .highlight-box {
      background: #fef9c3;
      padding: 0.6rem;
      border-radius: 0.8rem;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
<div class="calculator-container">
  <h1>
    <i class="fas fa-calculator"></i> Profit Calculator
  </h1>
  <div class="subtitle">
    Meesho (exact dispatch formula) • Shopify/D2C (with ROI)
  </div>

  <div class="mode-tabs">
    <button id="modeEcom" class="mode-btn active">
      <i class="fas fa-store-alt"></i> Meesho (E‑commerce)
    </button>
    <button id="modeD2C" class="mode-btn">
      <i class="fas fa-globe"></i> Shopify / D2C
    </button>
  </div>

  <div class="card-grid">
    <div class="input-card" id="inputCard"></div>

    <div class="results-panel" id="resultsPanel">
      <h2><i class="fas fa-chart-pie"></i> Profit Summary</h2>
      <div id="resultContent"></div>
      <button id="resetButton" class="reset-btn">
        <i class="fas fa-undo-alt"></i> Reset Values
      </button>
    </div>
  </div>
  <div class="footer-note">
    <i class="fas fa-info-circle"></i> Meesho: Delivery Rate = 100% − Return Rate • Damage deducts Product Cost • RTO affects Ad+Pack cost base
  </div>
</div>

<script>
  (function() {
    const modeEcomBtn = document.getElementById('modeEcom');
    const modeD2CBtn = document.getElementById('modeD2C');
    const inputCard = document.getElementById('inputCard');
    const resultContent = document.getElementById('resultContent');
    const resetBtn = document.getElementById('resetButton');

    let currentMode = 'ecommerce';

    const defaults = {
      ecommerce: {
        productCost: 400,
        advertisementCost: 100,
        packingCost: 30,
        settlementAmount: 600,
        returnRate: 8,
        rtoRate: 5,
        damageRate: 3,
        returnCharge: 50
      },
      d2c: {
        productCost: 400,
        advertisementCost: 90,
        shippingCost: 40,
        settlementAmount: 700,
        packingOverhead: 30,
        rtoRate: 6
      }
    };

    let values = JSON.parse(JSON.stringify(defaults.ecommerce));

    function syncValuesFromDOM() {
      if (currentMode === 'ecommerce') {
        values.productCost = parseFloat(document.getElementById('productCost')?.value) || 0;
        values.advertisementCost = parseFloat(document.getElementById('advertisementCost')?.value) || 0;
        values.packingCost = parseFloat(document.getElementById('packingCost')?.value) || 0;
        values.settlementAmount = parseFloat(document.getElementById('settlementAmount')?.value) || 0;
        values.returnRate = parseFloat(document.getElementById('returnRate')?.value) || 0;
        values.rtoRate = parseFloat(document.getElementById('rtoRate')?.value) || 0;
        values.damageRate = parseFloat(document.getElementById('damageRate')?.value) || 0;
        values.returnCharge = parseFloat(document.getElementById('returnCharge')?.value) || 0;
      } else {
        values.productCost = parseFloat(document.getElementById('productCost')?.value) || 0;
        values.advertisementCost = parseFloat(document.getElementById('advertisementCost')?.value) || 0;
        values.shippingCost = parseFloat(document.getElementById('shippingCost')?.value) || 0;
        values.settlementAmount = parseFloat(document.getElementById('settlementAmount')?.value) || 0;
        values.packingOverhead = parseFloat(document.getElementById('packingOverhead')?.value) || 0;
        values.rtoRate = parseFloat(document.getElementById('rtoRate')?.value) || 0;
      }
    }

    function computeResults() {
      syncValuesFromDOM();
      let deliveryRate, profitPerOrder, profitPerDeliveredOrder, roi = null;

      if (currentMode === 'ecommerce') {
        const returnRate = Math.min(100, Math.max(0, values.returnRate || 0));
        const rtoRate = Math.min(100, Math.max(0, values.rtoRate || 0));
        const damageRate = Math.min(100, Math.max(0, values.damageRate || 0));
        
        // Delivery Rate = 100 - Return Rate
        deliveryRate = Math.max(0, 100 - returnRate);
        
        const settlement = values.settlementAmount || 0;
        const productCost = values.productCost || 0;
        const adCost = values.advertisementCost || 0;
        const packingCost = values.packingCost || 0;
        const returnCharge = values.returnCharge || 0;
        
        // Convert percentages to decimals for calculation
        const DR = deliveryRate / 100;
        const DMR = damageRate / 100;
        const RTR = returnRate / 100;
        const RTOR = rtoRate / 100;
        
        // Sum of rates for denominator (Return Rate + RTO Rate + Delivery Rate)
        const sumRates = returnRate + rtoRate + deliveryRate; // in percentage
        const returnChargeDenominator = sumRates > 0 ? sumRates : 1;
        
        // FORMULA:
        // Profit = Settlement × DR 
        //        - Product Cost × (DR + DMR)
        //        - (Ad + Packing) × (DR + RTOR + RTR)
        //        - Return Charge × RTR / (RTR + RTOR + DR)
        
        const term1 = settlement * DR;
        const term2 = productCost * (DR + DMR);
        const term3 = (adCost + packingCost) * (DR + RTOR + RTR);
        const term4 = returnCharge * (returnRate / returnChargeDenominator);
        
        profitPerOrder = term1 - term2 - term3 - term4;
        
        // Profit Per Delivered Order
        profitPerDeliveredOrder = DR > 0 ? profitPerOrder / DR : 0;
        
      } else {
        // D2C / Shopify
        const rtoRate = Math.min(100, Math.max(0, values.rtoRate || 0));
        deliveryRate = Math.max(0, 100 - rtoRate);
        const DR = deliveryRate / 100;
        
        const settlement = values.settlementAmount || 0;
        const productCost = values.productCost || 0;
        const adCost = values.advertisementCost || 0;
        const shippingCost = values.shippingCost || 0;
        const packingOverhead = values.packingOverhead || 0;

        profitPerOrder = (settlement * DR) 
                         - (productCost * DR) 
                         - (adCost + shippingCost + packingOverhead);
        
        profitPerDeliveredOrder = DR > 0 ? profitPerOrder / DR : 0;
        
        // ROI = Settlement / Ad Cost
        roi = adCost > 0 ? settlement / adCost : 0;
      }

      return {
        deliveryRate: Math.max(0, deliveryRate),
        profitPerOrder,
        profitPerDeliveredOrder,
        roi
      };
    }

    function renderResults() {
      const { deliveryRate, profitPerOrder, profitPerDeliveredOrder, roi } = computeResults();
      
      const formattedDelivery = deliveryRate.toFixed(2);
      const formattedProfitOrder = profitPerOrder.toFixed(2);
      const formattedProfitDelivered = profitPerDeliveredOrder.toFixed(2);

    
      if (currentMode === 'ecommerce') {
        const retRate = values.returnRate || 0;
        const rtoRate = values.rtoRate || 0;
        const damRate = values.damageRate || 0;
        const DR = deliveryRate / 100;
        const DMR = damRate / 100;
        const RTR = retRate / 100;
        const RTOR = rtoRate / 100;
        const sumRates = retRate + rtoRate + deliveryRate;
        
        const setAmt = values.settlementAmount || 0;
        const prodCost = values.productCost || 0;
        const adPack = (values.advertisementCost || 0) + (values.packingCost || 0);
        const retCharge = values.returnCharge || 0;
        
        const t1 = (setAmt * DR).toFixed(2);
        const t2 = (prodCost * (DR + DMR)).toFixed(2);
        const t3 = (adPack * (DR + RTOR + RTR)).toFixed(2);
        const t4 = (retCharge * (retRate / (sumRates > 0 ? sumRates : 1))).toFixed(2);
        
        formulaBreakdown = `
          <div class="formula-breakdown">
            <strong>Breakdown:</strong><br>
            + Settlement × ${(DR*100).toFixed(1)}% = ₹${t1}<br>
            − Product Cost × ${((DR+DMR)*100).toFixed(1)}% = ₹${t2}<br>
            − (Ad+Pack) × ${((DR+RTOR+RTR)*100).toFixed(1)}% = ₹${t3}<br>
            − Return Charge × ${retRate}%/${sumRates.toFixed(0)}% = ₹${t4}
          </div>
        `;
      }

      let roiHtml = '';
      if (currentMode === 'd2c' && roi !== null) {
        const roiFormatted = roi.toFixed(2);
        roiHtml = `
          <div class="roi-box">
            <div class="result-label" style="color:#fef3c7;"><i class="fas fa-chart-line"></i> ROI (Settlement ÷ Ad Cost)</div>
            <div class="result-value" style="color:#fbbf24;">${roiFormatted}x</div>
            <div style="font-size:0.7rem; color:#fde68a;">Return on ad spend</div>
          </div>
        `;
      }

      const html = `
        ${roiHtml}
        <div class="result-item">
          <div class="result-label"><i class="fas fa-truck"></i> Delivery Rate</div>
          <div class="result-value">${formattedDelivery}% 
           
          </div>
        </div>
        <div class="result-item">
          <div class="result-label"><i class="fas fa-coins"></i> Profit Per Order (Dispatch)</div>
          <div class="result-value">₹ ${formattedProfitOrder}</div>
          ${formulaBreakdown}
        </div>
        <div class="result-item">
          <div class="result-label"><i class="fas fa-box-check"></i> Profit Per Delivered Order</div>
          <div class="result-value">₹ ${formattedProfitDelivered} <small>/ delivered</small></div>
        </div>
      `;
      resultContent.innerHTML = html;
    }

    function renderInputs() {
      if (currentMode === 'ecommerce') {
        inputCard.innerHTML = `
          <h2><i class="fas fa-store-alt"></i> Meesho Details</h2>
          <div class="input-group">
            <label><i class="fas fa-tag"></i> Product Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="productCost" step="any" min="0" value="${values.productCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-ad"></i> Advertisement Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="advertisementCost" step="any" min="0" value="${values.advertisementCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-box"></i> Packing Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="packingCost" step="any" min="0" value="${values.packingCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-hand-holding-usd"></i> Settlement Amount (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="settlementAmount" step="any" min="0" value="${values.settlementAmount}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-undo-alt"></i> Return Rate (%)</label>
            <div class="input-wrapper"><input type="number" id="returnRate" step="any" min="0" max="100" value="${values.returnRate}"><span class="percent-symbol">%</span></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-times-circle"></i> RTO Rate (%)</label>
            <div class="input-wrapper"><input type="number" id="rtoRate" step="any" min="0" max="100" value="${values.rtoRate}"><span class="percent-symbol">%</span></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-exclamation-triangle"></i> Damage Rate (%)</label>
            <div class="input-wrapper"><input type="number" id="damageRate" step="any" min="0" max="100" value="${values.damageRate}"><span class="percent-symbol">%</span></div>
          </div>
          <div class="input-group highlight-box">
            <label style="color:#854d0e;"><i class="fas fa-receipt"></i> Return Charge (per return, ₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="returnCharge" step="any" min="0" value="${values.returnCharge}"></div>
            <div style="font-size:0.7rem; color:#713f12; margin-top:0.25rem;">
              Deducted: Return Charge × Return Rate / (Return + RTO + Delivery)
            </div>
          </div>
        `;
      } else {
        inputCard.innerHTML = `
          <h2><i class="fas fa-globe"></i> Shopify / D2C Details</h2>
          <div class="input-group">
            <label><i class="fas fa-tag"></i> Product Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="productCost" step="any" min="0" value="${values.productCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-ad"></i> Advertisement Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="advertisementCost" step="any" min="0" value="${values.advertisementCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-shipping-fast"></i> Shipping Cost (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="shippingCost" step="any" min="0" value="${values.shippingCost}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-hand-holding-usd"></i> Settlement Amount (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="settlementAmount" step="any" min="0" value="${values.settlementAmount}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-tools"></i> Packing + Overhead (₹)</label>
            <div class="input-wrapper"><span>₹</span><input type="number" id="packingOverhead" step="any" min="0" value="${values.packingOverhead}"></div>
          </div>
          <div class="input-group">
            <label><i class="fas fa-times-circle"></i> RTO Rate (%)</label>
            <div class="input-wrapper"><input type="number" id="rtoRate" step="any" min="0" max="100" value="${values.rtoRate}"><span class="percent-symbol">%</span></div>
          </div>
        `;
      }

      const allInputs = inputCard.querySelectorAll('input[type="number"]');
      allInputs.forEach(input => {
        input.addEventListener('input', function() {
          syncValuesFromDOM();
          renderResults();
        });
      });
    }

    function setMode(mode) {
      if (mode === currentMode) return;
      
      if (mode === 'ecommerce') {
        values = JSON.parse(JSON.stringify(defaults.ecommerce));
      } else {
        values = JSON.parse(JSON.stringify(defaults.d2c));
      }
      
      currentMode = mode;
      
      if (mode === 'ecommerce') {
        modeEcomBtn.classList.add('active');
        modeD2CBtn.classList.remove('active');
      } else {
        modeD2CBtn.classList.add('active');
        modeEcomBtn.classList.remove('active');
      }
      
      renderInputs();
      renderResults();
    }

    function resetToDefaults() {
      if (currentMode === 'ecommerce') {
        values = JSON.parse(JSON.stringify(defaults.ecommerce));
      } else {
        values = JSON.parse(JSON.stringify(defaults.d2c));
      }
      renderInputs();
      renderResults();
    }

    modeEcomBtn.addEventListener('click', () => setMode('ecommerce'));
    modeD2CBtn.addEventListener('click', () => setMode('d2c'));
    resetBtn.addEventListener('click', resetToDefaults);

    renderInputs();
    renderResults();
  })();
</script>
</body>
</html>
